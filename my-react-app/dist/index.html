<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="DocAssist - Clinical Decision Support Tool for Rabies PEP" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DocAssist" />
    <title>DocAssist - Rabies PEP</title>
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script type="module" crossorigin src="/app.js"></script>
    <link rel="stylesheet" crossorigin href="/app.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (() => {
        const noticeText = 'This app is a copyright item of the owners under the Copyright Office, Government of India.';

        const addCopyrightNotice = () => {
          const root = document.getElementById('root');
          const description = Array.from(root.querySelectorAll('p')).find((paragraph) =>
            paragraph.textContent.startsWith('This clinical decision support tool has been designed')
          );

          if (!description || root.querySelector('[data-copyright-notice]')) return;

          const notice = document.createElement('p');
          notice.dataset.copyrightNotice = 'true';
          notice.textContent = noticeText;
          notice.style.cssText = 'max-width:680px;margin:20px auto 0;color:#475569;font-size:14px;font-weight:600;line-height:1.6;text-align:center;';
          description.insertAdjacentElement('afterend', notice);
        };

        new MutationObserver(addCopyrightNotice).observe(document.getElementById('root'), {
          childList: true,
          subtree: true
        });
        addCopyrightNotice();
      })();
    </script>
  </body>
</html>
