  font-weight: 800;\n  margin: 0 0 48px;\n  text-align: center;\n  background: var(--accent-gradient);\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n  background-clip: text;\n  letter-spacing: -0.8px;\n  line-height: 1.2;\n  position: relative;\n  padding-bottom: 24px;\n}\n\n.title::after {\n  content: '';\n  position: absolute;\n  bottom: 0;\n  left: 50%;\n  transform: translateX(-50%);\n  width: 80px;\n  height: 3px;\n  background: var(--accent-gradient);\n  border-radius: 2px;\n}\n\n.steps {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  margin-bottom: 56px;\n  position: relative;\n  padding: 0 40px;\n}\n\n.steps::before {\n  content: '';\n  position: absolute;\n  top: 24px;\n  left: 80px;\n  right: 80px;\n  height: 2px;\n  background: var(--border);\n  z-index: 0;\n}\n\n.step {\n  font-size: 13px;\n  font-weight: 600;\n  padding: 0;\n  border-radius: 0;\n  background: transparent;\n  color: var(--text-light);\n  border: none;\n  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);\n  position: relative;\n  z-index: 1;\n  cursor: default;\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 12px;\n  min-width: 0;\n}\n\n.step-number {\n  width: 48px;\n  height: 48px;\n  border-radius: 50%;\n  background: white;\n  border: 3px solid var(--border);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 16px;\n  font-weight: 700;\n  color: var(--text-light);\n  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);\n  position: relative;\n  box-shadow: var(--shadow-sm);\n  flex-shrink: 0;\n}\n\n.step-label {\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--text-light);\n  text-align: center;\n  max-width: 140px;\n  line-height: 1.4;\n  transition: color 0.3s;\n}\n\n.step.active .step-number {\n  background: var(--accent-gradient);\n  border-color: transparent;\n  color: white;\n  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);\n  transf
